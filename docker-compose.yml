services:
  gmw_db:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=gitmostwanted
      - MYSQL_USER=gitmostwanted
      - MYSQL_PASSWORD=gitmostwanted_pwd
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --mysql-native-password=ON
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  gmw_redis:
    image: redis:latest
    restart: unless-stopped

  gmw_web:
    build: .
    user: gitmostwanted
    entrypoint: ["/opt/gitmostwanted/entrypoint.sh", "web"]
    restart: unless-stopped
    volumes:
      - .:/opt/gitmostwanted
    environment:
      - GMW_APP_SETTINGS=/opt/gitmostwanted/instance.cfg
      - GMW_GITHUB_SHA=${GMW_GITHUB_SHA}
    depends_on:
      gmw_db:
        condition: service_healthy
      gmw_redis:
        condition: service_started
# uncomment the following lines if you want to bind it to localhost (http://localhost:5000).
#    ports:
#      - "5000:5000"

  gmw_celery:
    build: .
    user: gitmostwanted
    restart: unless-stopped
    entrypoint: ["/opt/gitmostwanted/entrypoint.sh", "celery"]
    environment:
      - GMW_APP_SETTINGS=/opt/gitmostwanted/instance.cfg
    volumes:
      - .:/opt/gitmostwanted
    depends_on:
      gmw_db:
        condition: service_healthy
      gmw_redis:
        condition: service_started
