{% macro flashed_messages(filter=None) -%}
  {% for type, msg in get_flashed_messages(with_categories=True, category_filter=filter) %}
    <div class="alert-banner alert-{{ type }}" role="alert">
      <span class="alert-text">{{ msg }}</span>
      <button type="button" class="alert-close" onclick="this.parentElement.remove()" aria-label="Close">&times;</button>
    </div>
  {% endfor %}
{%- endmacro %}
