{% extends "layout.html" %}

{% block body %}
  <section class="sponsorship-section">
    <div class="sponsorship-card">
      <h1 class="section-heading">Sponsorship</h1>
      <p class="sponsorship-subtitle">
        Goal: &euro;100 for <a href="https://cloud.google.com/bigquery/" target="_blank" rel="noopener">Google BigQuery</a> analysis
      </p>

      <div class="progress-track" role="progressbar" aria-valuenow="4.6" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill" style="width: 4.6%"></div>
      </div>

      <div class="table-card">
        <table class="modern-table">
          <thead>
            <tr>
              <th width="160">Date</th>
              <th>Sponsor</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>15.02.2019</td>
              <td>Aymar C.</td>
            </tr>
            <tr>
              <td>18.01.2019</td>
              <td>Thomas G.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="sponsorship-actions">
        <a href="https://2ka.by/coffee?project=gitmostwanted.com" class="btn btn-primary" target="_blank" rel="noopener">
          Support via PayPal
        </a>
        <span class="sponsorship-or">or</span>
        <a href="https://github.com/sponsors/kkamkou" class="btn btn-ghost" target="_blank" rel="noopener">
          GitHub Sponsors
        </a>
      </div>
    </div>
  </section>
{% endblock %}
